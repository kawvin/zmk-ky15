# 3个连接通道 (n+2)，1个是右
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# 分体键盘副手数量
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=0
# 电量报告
CONFIG_BT_BAS=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y


# 以下左为主手时打开
# 副屏显示
# CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y

# DONGLE电量显示
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

# 副屏电量显示
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERIPHERAL=n

# ========================================
# ZMK Studio（必须基于）
# ========================================
CONFIG_ZMK_STUDIO=y
# 注意：请勿设置 CONFIG_ZMK_STUDIO_LOCKING=n。
# Studio Locking 需要 BLE 连接，因此必须保持默认的 y。
# CONFIG_ZMK_STUDIO_LOCKING=y
# CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ========================================
# DYA Studio 模块（中央侧）
# ========================================
# BLE 管理
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# 电池历史记录
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
# 默认情况下，在USB供电时会跳过电池历史记录。
# 如需在USB连接期间也记录电池历史，请设置为n。
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# 设置RPC（闲置/睡眠设置）
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Split 事件中继（中央设备与外设设置同步）
# CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# 运行时输入处理器（在 DYA Studio 中更改轨迹球设置）
# 仅在有轨迹球/指点设备时需要
# CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
# CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# 保存设置
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000